# Creates the git tag and GitHub release after a version has been registered in General.
# With the secret DOCUMENTER_KEY (DocumenterTools.genkeys) the tag also starts the Docs workflow,
# so every release gets its own documentation version.
# Runs on the JuliaTagBot trigger comment, by hand, and every 6 hours in case the trigger is missing.
name: TagBot
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: write
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name != 'issue_comment' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
