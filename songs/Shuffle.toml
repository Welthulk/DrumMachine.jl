# Blues shuffle, 4 × 12 bars, triplet grid, kit BlackPearl (in the repo)
# Form: chorus 1 hi-hat shuffle (12) | chorus 2 with blues stops (12) | solo chorus ride (12)
#       | last chorus with blues ending on 4 (12)
# Shows: shuffle triplets, ghost notes on the "a", stop-time, triplet fill in the turnaround,
#        ride with hi-hat pedal, track settings
bpm = 90.0
chain = [1, 2, 2, 2, 2, 2, 2, 8, 2, 2, 2, 3,
         6, 6, 6, 6, 1, 2, 2, 8, 2, 2, 2, 3,
         5, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 3,
         1, 2, 2, 8, 2, 2, 2, 8, 2, 2, 2, 7]
click = false
countin = 1
fx = "Room"
fxmix = 0.25
kit = "BlackPearl"
master = 0.8
mono = false
name = "Shuffle"
repeats = 1
steps_per_beat = 3
swing = 0.6666666666666666
swing_on = 0
swing_version = 2
#            1+a2+a3+a4+a
# 1: shuffle with crash
[[pattern]]
steps = 12
    [pattern.rows]
    Crash = "X..........."
    HiHat = "..xx.xx.xx.x"
    Snare = "...X.....X.."
    Kick  = "X.....X....."
# 2: shuffle with ghost notes on the "a"
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat = "x.xx.xx.xx.x"
    Snare = "..oX....oX.o"
    Kick  = "X.....X....."
# 3: turnaround fill, triplets across snare and toms
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat    = "x.xx.x......"
    Snare    = "...X..Xxx..."
    Tom      = ".........Xx."
    FloorTom = "...........X"
    Kick     = "X.....X....X"
# 4: solo, ride shuffle, hi-hat pedal on 2 and 4
[[pattern]]
steps = 12
    [pattern.rows]
    Ride    = "X.xX.xX.xX.x"
    HHPedal = "...x.....x.."
    Snare   = "..oX....oX.."
    Kick    = "X.....X....."
# 5: solo with crash
[[pattern]]
steps = 12
    [pattern.rows]
    Crash   = "X..........."
    Ride    = "..xX.xX.xX.x"
    HHPedal = "...x.....x.."
    Snare   = "..oX....oX.."
    Kick    = "X.....X....."
# 6: blues stop, only beat 1, the hi-hat pedal keeps counting
[[pattern]]
steps = 12
    [pattern.rows]
    Crash   = "X..........."
    Kick    = "X..........."
    HHPedal = "...x.....x.."
# 7: blues ending, triplet crescendo onto 4
[[pattern]]
steps = 12
    [pattern.rows]
    Snare = "oooxxxXXX..."
    Crash = ".........X.."
    Kick  = ".........X.."
# 8: shuffle with open hi-hat on the last "a"
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat  = "x.xx.xx.xx.."
    HHOpen = "...........x"
    Snare  = "..oX....oX.."
    Kick   = "X.....X....."

[track.Kick]
vol = 0.9

[track.Ride]
vol = 0.9
pan = 0.2

[track.Crash]
vol = 0.85
