# Song in the style of "Everybody Wants to Rule the World" (Tears for Fears), 12/8, 37 bars
# Grid: 8th-note triplets, 4 dotted quarters per bar, dotted quarter = 112, 80s-style reverb
# Form: intro hi-hat + side stick (4) | verse (8) | chorus ride bell (8) | verse (8)
#       | chorus with a 6/8 bar at the end (8) | ending (1)
# Shows: triplet grid, time signature change 12/8 → 6/8, triplet fill across the toms, reverb effect,
#        track effects: chorus on hi-hat and side stick (80s shimmer), flanger on the crash,
#        snare brightened with EQ
bpm = 112.0
chain = [1, 1, 2, 2,  3, 4, 4, 6, 4, 5, 4, 6,  8, 7, 7, 9, 8, 7, 7, 9,
         3, 4, 5, 6, 4, 5, 4, 9,  8, 7, 7, 9, 8, 7, 7, 10,  11]
click = false
countin = 1
fx = "Hall"
fxmix = 0.22
kit = "CrocellKit"
master = 0.8
mono = false
name = "Rule the World Grundgroove"
repeats = 1
steps_per_beat = 3
swing = 0.6666666666666666
swing_on = 0
swing_version = 2
#            1+a2+a3+a4+a
# 1: Intro, hi-hat and bass drum only
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat = ".x.x.x.x.x.x"
    Kick  = "X.....X....."
# 2: Intro 2, side stick on 2 and 4
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat = ".x.x.x.x.x.x"
    Rim   = "...x.....x.."
    Kick  = "X.....X....."
# 3: Basic groove with crash
[[pattern]]
steps = 12
    [pattern.rows]
    Crash = "X..........."
    HiHat = "...x.x.x.x.x"
    Snare = "...X.....X.."
    Kick  = "X.xX..X.xX.."
# 4: Basic groove
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat = ".x.x.x.x.x.x"
    Snare = "...X.....X.."
    Kick  = "X.xX..X.xX.."
# 5: Basic groove with ghost notes
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat = ".x.x.x.x.x.x"
    Snare = "...X.o..oX.o"
    Kick  = "X.xX..X.xX.."
# 6: Transition with snare doubles and open hi-hat
[[pattern]]
steps = 12
    [pattern.rows]
    HiHat  = ".x.x.x.x...."
    HHOpen = "...........x"
    Snare  = "...X.....Xx."
    Kick   = "X.xX..X.xX.."
# 7: Chorus, ride triplets with bell on the beats
[[pattern]]
steps = 12
    [pattern.rows]
    RideBell = "X..X..X..X.."
    Ride     = ".xx.xx.xx.xx"
    Snare    = "...X.....X.."
    Kick     = "X.xX..X.xX.."
# 8: Chorus with crash
[[pattern]]
steps = 12
    [pattern.rows]
    Crash    = "X..........."
    RideBell = "...X..X..X.."
    Ride     = ".xx.xx.xx.xx"
    Snare    = "...X.....X.."
    Kick     = "X.xX..X.xX.."
# 9: Triplet fill snare → tom → floor tom
[[pattern]]
steps = 12
    [pattern.rows]
    Snare    = "X.xX.x......"
    Tom      = "......XxX..."
    FloorTom = ".........XxX"
    Kick     = "X.....X....."
# 10: Time signature change: one 6/8 bar with snare lead-in
[[pattern]]
steps = 6
    [pattern.rows]
    Crash = "X....."
    Kick  = "X....."
    Snare = "...oxX"
# 11: Ending with crash and open hi-hat
[[pattern]]
steps = 12
    [pattern.rows]
    Crash  = "X..........."
    HHOpen = "X..........."
    Snare  = "X..........."
    Kick   = "X..........."

[track.Snare]
vol = 1.1
eq_low = 3.0
eq_mid = -4.0
eq_mid_freq = 500.0
eq_high = 6.0

[track.RideBell]
vol = 0.9
pan = 0.2

[track.HiHat]
mod = "Chorus"
mod_mix = 1.0
mod_rate = 0.5
mod_depth = 1.0
mod_feedback = 0.3

[track.Rim]
mod = "Chorus"
mod_mix = 1.0
mod_rate = 0.8
mod_depth = 0.9
mod_feedback = 0.3

[track.Crash]
mod = "Flanger"
mod_mix = 1.0
mod_rate = 0.2
mod_depth = 1.0
mod_feedback = 0.7
