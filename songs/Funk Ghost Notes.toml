# Funk song with ghost notes, 38 bars, light 16th swing (57 %)
# Form: A 8th hi-hat (8) | B 16th hi-hat with offbeat accents (8) | stop (1) | A short (4)
#       | breakdown side stick (8) | B (8) | ending (1)
# Shows: 16th swing, three dynamic levels on snare and hi-hat, paradiddle fill, ghost note crescendo,
#        breakdown with side stick, track effects: snare EQ for crisp ghost notes, kick with more low end
bpm = 92.0
chain = [1, 2, 3, 2, 2, 3, 2, 4,  6, 5, 7, 5, 5, 7, 5, 8,  11,  1, 2, 3, 4,
         9, 9, 10, 10, 9, 9, 10, 11,  6, 5, 7, 5, 5, 7, 5, 8,  12]
click = false
countin = 1
fx = "Room"
fxmix = 0.2
kit = "CrocellKit"
master = 0.8
mono = false
name = "Funk Ghost Notes"
repeats = 1
steps_per_beat = 4
swing = 0.57
swing_on = 16
swing_version = 2
#               1e+a2e+a3e+a4e+a
# 1: A with crash
[[pattern]]
steps = 16
    [pattern.rows]
    Crash = "X..............."
    HiHat = "..x.x.x.x.x.x.x."
    Snare = "....X..o.o..X..o"
    Kick  = "X.x.......X..x.."
# 2: A, basic groove
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "x.x.x.x.x.x.x.x."
    Snare = "....X..o.o..X..o"
    Kick  = "X.x.......X..x.."
# 3: A variation, more ghost notes, open hi-hat on the 4+
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat  = "x.x.x.x.x.x.x..."
    HHOpen = "..............x."
    Snare  = ".o..X.oo.o.oX..o"
    Kick   = "X.x...x...X..x.."
# 4: A fill, ghost note roll into the accent
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "x.x.x.x.x.x....."
    Snare = "....X..o.o..oxxX"
    Kick  = "X.x.......X....."
# 5: B, 16th hi-hat with accents on the offbeats
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "xoXoxoXoxoXoxoXo"
    Snare = "....X..o.o..X..."
    Kick  = "X..x..x...X..x.."
# 6: B with crash
[[pattern]]
steps = 16
    [pattern.rows]
    Crash = "X..............."
    HiHat = "..XoxoXoxoXoxoXo"
    Snare = "....X..o.o..X..."
    Kick  = "X..x..x...X..x.."
# 7: B variation, open hi-hat on 2a and 4a
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat  = "xoXoxoX.xoXoxoX."
    HHOpen = ".......x.......x"
    Snare  = "....X..o.o..X..o"
    Kick   = "X..x..x...X..x.."
# 8: paradiddle fill (RLRR LRLL) across tom and snare
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat    = "xoXoxoXo........"
    Snare    = "....X..o.o..X.ox"
    Tom      = "........X.xx...."
    FloorTom = ".............x.."
    Kick     = "X..x..x.X......."
# 9: breakdown, quiet 16th hi-hat, side stick
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "xoxoxoxoxoxoxoxo"
    Rim   = "....x.......x..."
    Kick  = "X.........x....."
# 10: breakdown with snare ghost notes between the side sticks
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "xoxoxoxoxoxoxoxo"
    Rim   = "....x.......x..."
    Snare = ".o.o...o.o.o...o"
    Kick  = "X..x......x..x.."
# 11: stop with ghost note crescendo
[[pattern]]
steps = 16
    [pattern.rows]
    Crash = "X..X............"
    Kick  = "X..X............"
    Snare = "...X....oooxxxXX"
# 12: ending
[[pattern]]
steps = 16
    [pattern.rows]
    Crash = "X..............."
    Snare = "X..............."
    Kick  = "X..............."

[track.HiHat]
vol = 0.9
pan = 0.15

[track.Snare]
vol = 1.05
eq_mid = 4.0
eq_mid_freq = 2000.0
eq_high = 5.0

[track.Rim]
vol = 1.15

[track.Kick]
eq_low = 5.0
eq_mid = -5.0
eq_mid_freq = 315.0
