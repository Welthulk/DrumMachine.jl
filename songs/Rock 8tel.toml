# Rock song with an 8th feel, 38 bars, kit BlackPearl (in the repo), room reverb
# Form: intro floor tom (4) | verse (8) | pre-chorus four-on-the-floor (4) | chorus ride + push (8)
#       | bridge half-time with side stick (4) | stop in a 2/4 bar (1) | chorus (8) | final hit (1)
# Shows: accents, ghost notes, time change 4/4 -> 2/4, 3-group fill, ride bell, anticipation,
#        tuned floor tom, track volumes and panning,
#        track effects: flanger on the open hi-hat (pre-chorus) and crash ("jet"),
#        bass drum with EQ (mids cut, more low end and click)
bpm = 100.0
chain = [1, 1, 1, 2,  3, 4, 5, 6, 4, 4, 5, 6,  7, 7, 7, 8,  9, 10, 10, 11, 10, 10, 10, 6,
         12, 12, 12, 13,  14,  9, 10, 10, 11, 10, 10, 10, 13,  15]
click = false
countin = 1
fx = "Room"
fxmix = 0.3
kit = "BlackPearl"
master = 0.8
mono = false
name = "Rock 8tel"
repeats = 1
steps_per_beat = 4
swing = 0.5
swing_on = 0
swing_version = 2
#                 1e+a2e+a3e+a4e+a
# 1: intro, floor tom in 8ths with accents on the quarters
[[pattern]]
steps = 16
    [pattern.rows]
    FloorTom = "X.x.X.x.X.x.X.x."
    Kick     = "X.......X......."
# 2: intro fill, snare crescendo
[[pattern]]
steps = 16
    [pattern.rows]
    FloorTom = "X.x.X.x........."
    Snare    = "........o.o.xxXX"
    Kick     = "X.......X......X"
# 3: verse with crash
[[pattern]]
steps = 16
    [pattern.rows]
    Crash = "X..............."
    HiHat = "..x.X.x.X.x.X.x."
    Snare = "....X..o....X..."
    Kick  = "X.......X.X....."
# 4: verse, hi-hat accents on the quarters, ghost note before the 3
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "X.x.X.x.X.x.X.x."
    Snare = "....X..o....X..."
    Kick  = "X.......X.X....."
# 5: verse variation, bass drum on the 1+, open hi-hat on the 4+
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat  = "X.x.X.x.X.x.X..."
    HHOpen = "..............x."
    Snare  = "....X..o....X..."
    Kick   = "X.x.....X.X..x.."
# 6: short fill on the 4
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat    = "X.x.X.x.X.x....."
    Snare    = "....X..o....Xxx."
    FloorTom = "...............X"
    Kick     = "X.......X.X....X"
# 7: pre-chorus, four-on-the-floor with open hi-hat on the offbeats
[[pattern]]
steps = 16
    [pattern.rows]
    HHOpen  = "..x...x...x...x."
    HHPedal = "X...X...X...X..."
    Snare   = "....X.......X..."
    Kick    = "X...X...X...X..."
# 8: pre-chorus fill (paradiddle feel across snare and toms)
[[pattern]]
steps = 16
    [pattern.rows]
    HHOpen   = "..x...x........."
    Snare    = "....X...Xoxo...."
    Tom      = "............xx.."
    FloorTom = "..............xX"
    Kick     = "X...X...X......X"
# 9: chorus with crash, ride bell on the quarters
[[pattern]]
steps = 16
    [pattern.rows]
    Crash    = "X..............."
    RideBell = "....X...X...X..."
    Ride     = "..x...x...x...x."
    Snare    = "....X.......X..o"
    Kick     = "X.x....xX.X....."
# 10: chorus
[[pattern]]
steps = 16
    [pattern.rows]
    RideBell = "X...X...X...X..."
    Ride     = "..x...x...x...x."
    Snare    = "....X.......X..o"
    Kick     = "X.x....xX.X....."
# 11: chorus push: crash + snare anticipated on the 4+
[[pattern]]
steps = 16
    [pattern.rows]
    RideBell = "X...X...X...X..."
    Ride     = "..x...x...x....."
    Crash    = "..............X."
    Snare    = "....X.......X.X."
    Kick     = "X.x....xX.X...X."
# 12: bridge half-time, 16th hi-hat with dynamics, side stick on the 3
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "XoxoXoxoXoxoXoxo"
    Rim   = "........X......."
    Snare = "..............o."
    Kick  = "X......x..x....."
# 13: 3-group fill across the bar line (snare - tom - bass drum, linear)
[[pattern]]
steps = 16
    [pattern.rows]
    Snare    = "X..x..x..x..X..X"
    Tom      = ".x..x..x........"
    FloorTom = "..........x..x.."
    Kick     = "..x..x..x..x..x."
# 14: stop in a 2/4 bar, only crash + bass drum, hi-hat pedal keeps counting
[[pattern]]
steps = 8
    [pattern.rows]
    Crash   = "X......."
    Kick    = "X......."
    HHPedal = "....x..."
# 15: final hit
[[pattern]]
steps = 16
    [pattern.rows]
    Crash    = "X..............."
    Snare    = "X..............."
    FloorTom = "X..............."
    Kick     = "X..............."

[track.Crash]
vol = 0.85
pan = -0.2
mod = "Flanger"
mod_mix = 1.0
mod_rate = 0.15
mod_depth = 1.0
mod_feedback = 0.8

[track.FloorTom]
pitch = -1.0

[track.Ride]
vol = 0.9
pan = 0.2

[track.Rim]
vol = 1.1

[track.HHOpen]
mod = "Flanger"
mod_mix = 1.0
mod_rate = 0.3
mod_depth = 0.9
mod_feedback = 0.75

[track.Kick]
eq_low = 5.0
eq_mid = -6.0
eq_mid_freq = 400.0
eq_high = 5.0
