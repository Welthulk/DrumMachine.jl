swing = 0.5
swing_on = 0
swing_version = 2
#            1e+a2e+a3e+a4e+a
# 1: intro: hi-hat and kick only, the band builds up
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "X.x.X.x.X.x.X.x."
    Kick  = "X.....X...X....."
