# Rock in the style of Rush "Tom Sawyer" (drums: Neil Peart), 106 bars, kit CrocellKit
# Not a transcription: grooves and form built after the song, for playing along and practice.
# Grid: 16ths, straight, quarter = 88
# Form: intro (8) | verse 1 (16) | chorus (8) | verse 2 (16) | chorus (8) | solo (16) | 7/8 (16 + fill) | verse 3 (8) | outro (8) | ending (1)
# Shows: accented 8th hi-hats with open hi-hat before the 1, syncopated kick, ride with bell
#        in the chorus, 16th kick figures in the solo, a 7/8 section (2+2+3), tom fills.
bpm = 88.0
chain = [1, 1, 1, 1, 1, 1, 1, 5, 2, 3, 3, 4, 3, 3, 3, 5, 3, 3, 3, 4, 3, 3, 3, 6, 7, 8, 8, 8, 8, 8, 8, 6, 2, 3, 3, 4, 3, 3, 3, 5, 3, 3, 3, 4, 3, 3, 3, 6, 7, 8, 8, 8, 8, 8, 8, 6, 9, 10, 10, 10, 10, 10, 10, 5, 9, 10, 10, 10, 10, 10, 10, 6, 11, 11, 11, 12, 11, 11, 11, 12, 11, 11, 11, 12, 11, 11, 11, 12, 6, 2, 3, 3, 4, 3, 3, 3, 6, 13, 14, 14, 14, 13, 14, 14, 6, 15]
click = false
countin = 1
fx = "Room"
fxmix = 0.2
kit = "CrocellKit"
master = 0.8
mono = false
name = "Tom-Sawyer-Stil (Rush)"
repeats = 1
