# Song based on "Funk: What-Is-Hip-Stil (Tower of Power)", 32 bars
# Form: A (8) | ride bridge (4) | A + break (8) | breakdown (4) | final A + tom fill (8)
bpm = 124.0
chain = [1, 2, 2, 3, 2, 2, 3, 4,  5, 6, 6, 10,  1, 2, 2, 3, 2, 3, 7, 8,  9, 9, 9, 10,  1, 2, 2, 3, 2, 3, 2, 11]
click = false
countin = 1
fx = "Clean"
fxmix = 0.25
kit = "CrocellKit"
master = 0.8
mono = false
name = "Hip Workout"
repeats = 2
steps_per_beat = 4
swing = 0.5
swing_on = 0
swing_version = 2

#               1e+a2e+a3e+a4e+a

# 1: groove with crash (start of section)
[[pattern]]
steps = 16
    [pattern.rows]
    Crash  = "X..............."
    HHOpen = "..............X."
    HiHat  = "..x.x.x.x.x.x..."
    Kick   = "X..x..x..x....x."
    Snare  = ".o..X..o.o..X..o"

# 2: groove
[[pattern]]
steps = 16
    [pattern.rows]
    HHOpen = "..............X."
    HiHat  = "x.x.x.x.x.x.x..."
    Kick   = "X..x..x..x....x."
    Snare  = ".o..X..o.o..X..o"

# 3: groove variation
[[pattern]]
steps = 16
    [pattern.rows]
    HHOpen = "......X.......X."
    HiHat  = "x.x.x...x.x.x..."
    Kick   = "X..x..x...X..x.."
    Snare  = ".o..X..o.o.oX.o."

# 4: half groove + fill snare -> tom -> floor
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat    = "x.x.x.x........."
    Kick     = "X..x..x..x......"
    Snare    = ".o..X..oX.xx...."
    Tom      = "............xx.."
    FloorTom = "..............xX"

# 5: ride bridge with crash
[[pattern]]
steps = 16
    [pattern.rows]
    Crash    = "X..............."
    Ride     = "....x...x...x..."
    RideBell = "..x...x...x...x."
    HHPedal  = "....x.......x..."
    Kick     = "X.x....x..x..x.."
    Snare    = "....X..o.o..X..o"

# 6: ride bridge
[[pattern]]
steps = 16
    [pattern.rows]
    Ride     = "x...x...x...x..."
    RideBell = "..x...x...x...x."
    HHPedal  = "....x.......x..."
    Kick     = "X.x....x..x..x.."
    Snare    = "....X..o.o..X..o"

# 7: break, unison kicks on 1 and 2a, then space
[[pattern]]
steps = 16
    [pattern.rows]
    Crash   = "X.....X........."
    Kick    = "X.....X........."
    Snare   = "X.....X........."
    HHPedal = "........x...x..."

# 8: break, kicks on 1, 2a, 3+ and pickup fill
[[pattern]]
steps = 16
    [pattern.rows]
    Crash    = "X.....X...X....."
    Kick     = "X.....X...X....."
    Snare    = "X.....X...X.xx.."
    Tom      = "..............x."
    FloorTom = "...............X"

# 9: breakdown, hi-hat + rim
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat = "x.x.x.x.x.x.x.x."
    Rim   = "....x.......x..."
    Kick  = "X.........x....."

# 10: linear fill (never two voices at once)
[[pattern]]
steps = 16
    [pattern.rows]
    HiHat    = "x..x..x........."
    Snare    = ".o..X..o.xx..x.."
    Kick     = "..x..x..x..x..x."
    Tom      = "............x..."
    FloorTom = "...............X"

# 11: final fill across the whole bar
[[pattern]]
steps = 16
    [pattern.rows]
    Snare    = "X.xxX.xx........"
    Tom      = "........X.xx...."
    FloorTom = "............X.xX"
    Kick     = "X...x...x...x..."
